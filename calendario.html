<div id="calendar-item-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 p-4" role="dialog" aria-modal="true" aria-labelledby="calendar-modal-title">
    <div class="absolute inset-0" data-calendar-modal-backdrop></div>
    <section class="relative z-10 w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-6 shadow-2xl sm:p-8">
        <button id="calendar-modal-close" type="button" aria-label="Fechar detalhes" class="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full bg-gray-100 text-xl text-slate-600 hover:bg-gray-200">&times;</button>
        <p id="calendar-modal-type" class="mb-2 text-xs font-bold uppercase tracking-wider text-blue-700"></p>
        <h2 id="calendar-modal-title" class="pr-10 text-xl font-bold text-slate-900"></h2>
        <p id="calendar-modal-date" class="mt-2 text-sm text-slate-500"></p>
        <p id="calendar-modal-description" class="mt-5 whitespace-pre-wrap text-sm leading-relaxed text-slate-700"></p>
        <div id="calendar-modal-progress" class="mt-5 hidden">
            <div class="mb-2 flex justify-between text-sm font-medium text-slate-600"><span id="calendar-modal-status"></span><span id="calendar-modal-progress-label"></span></div>
            <div class="h-2.5 overflow-hidden rounded-full bg-slate-200"><div id="calendar-modal-progress-bar" class="h-full rounded-full bg-blue-700 transition-all"></div></div>
        </div>
    </section>
</div>
<script id="calendar-meta-data" type="application/json">[]</script>
<script>
    (() => {
        const title = document.getElementById('calendar-title-text');
        const grid = document.getElementById('calendar-grid');
        const titleButton = document.getElementById('calendar-title');
        const monthPicker = document.getElementById('month-picker');
        const monthSelect = document.getElementById('month-picker-month');
        const yearInput = document.getElementById('month-picker-year');
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const today = new Date();
        let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const calendarItems = JSON.parse(document.getElementById('calendar-meta-data')?.textContent || '[]');
        const itemsByDate = calendarItems.reduce((result, item) => {
            const itemDate = item.type === 'meta' ? item.end_date : item.date;
            (result[itemDate] ||= []).push(item);
            return result;
        }, {});
        const modal = document.getElementById('calendar-item-modal');
        const modalTitle = document.getElementById('calendar-modal-title');
        const modalDate = document.getElementById('calendar-modal-date');
        const modalDescription = document.getElementById('calendar-modal-description');
        const modalProgress = document.getElementById('calendar-modal-progress');

        function formatDate(dateValue) {
            const [year, month, day] = dateValue.split('-');
            return `${day}/${month}/${year}`;
        }

        function openItem(item) {
            const isMeta = item.type === 'meta';
            document.getElementById('calendar-modal-type').textContent = isMeta ? 'Meta' : 'Evento';
            modalTitle.textContent = item.title;
            modalDate.textContent = isMeta
                ? `${item.sector} · ${formatDate(item.start_date)}–${formatDate(item.end_date)}`
                : `${item.sector} · ${formatDate(item.date)}${item.time ? ` às ${item.time}` : ''}`;
            modalDescription.textContent = item.description || 'Sem descrição.';
            modalDescription.classList.toggle('hidden', !item.description);
            modalProgress.classList.toggle('hidden', !isMeta);

            if (isMeta) {
                const statusNames = { a_fazer: 'A fazer', em_andamento: 'Em andamento', concluida: 'Concluída' };
                const progress = Math.max(0, Math.min(100, Number(item.progress) || 0));
                document.getElementById('calendar-modal-status').textContent = statusNames[item.status] || item.status;
                document.getElementById('calendar-modal-progress-label').textContent = `${progress}% concluído`;
                document.getElementById('calendar-modal-progress-bar').style.width = `${progress}%`;
            } else {
                const categoryNames = { reuniao: 'Reunião', fiscalizacao: 'Fiscalização', manutencao: 'Manutenção', outros: 'Outros', eventos: 'Eventos' };
                document.getElementById('calendar-modal-type').textContent = `Evento · ${categoryNames[item.category] || item.category}`;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('overflow-hidden');
            document.getElementById('calendar-modal-close').focus();
        }

        function closeItem() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
        }

        document.getElementById('calendar-modal-close').addEventListener('click', closeItem);
        modal.addEventListener('click', (event) => {
            if (event.target === modal || event.target.hasAttribute('data-calendar-modal-backdrop')) closeItem();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) closeItem();
        });

        function makeDate(year, month, day = 1) {
            const date = new Date(0);
            date.setFullYear(year, month, day);
            date.setHours(0, 0, 0, 0);
            return date;
        }

        monthNames.forEach((monthName, index) => {
            const option = document.createElement('option');
            option.value = String(index);
            option.textContent = monthName;
            monthSelect.appendChild(option);
        });

        function setPickerVisibility(isVisible) {
            monthPicker.classList.toggle('hidden', !isVisible);
            titleButton.setAttribute('aria-expanded', String(isVisible));
            if (isVisible) {
                monthSelect.value = String(visibleMonth.getMonth());
                yearInput.value = String(visibleMonth.getFullYear());
                monthSelect.focus();
            }
        }

        function renderCalendar() {
            const year = visibleMonth.getFullYear();
            const month = visibleMonth.getMonth();
            const firstWeekday = makeDate(year, month, 1).getDay();
            const daysInMonth = makeDate(year, month + 1, 0).getDate();
            const daysInPreviousMonth = makeDate(year, month, 0).getDate();
            const cellCount = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

            title.textContent = `${monthNames[month]} ${year}`;
            monthSelect.value = String(month);
            yearInput.value = String(year);
            grid.replaceChildren();

            for (let index = 0; index < cellCount; index += 1) {
                const dayOffset = index - firstWeekday + 1;
                const date = makeDate(year, month, dayOffset);
                const isCurrentMonth = dayOffset > 0 && dayOffset <= daysInMonth;
                const isToday = date.getFullYear() === today.getFullYear()
                    && date.getMonth() === today.getMonth()
                    && date.getDate() === today.getDate();
                const cell = document.createElement('div');
                const isLastRow = index >= cellCount - 7;
                const isLastColumn = index % 7 === 6;

                cell.className = `min-h-28 md:min-h-[120px] p-1.5 text-xs ${isLastRow ? '' : 'border-b'} ${isLastColumn ? '' : 'border-r'} border-gray-200 ${isCurrentMonth ? '' : 'text-gray-400 bg-gray-50'}`;
                if (isToday && isCurrentMonth) cell.classList.add('font-bold', 'text-blue-700', 'bg-blue-50');
                cell.setAttribute('role', 'gridcell');
                cell.textContent = String(isCurrentMonth ? dayOffset : (dayOffset <= 0 ? daysInPreviousMonth + dayOffset : dayOffset - daysInMonth));
                const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                (itemsByDate[dateKey] || []).forEach((item) => {
                    const badge = document.createElement('button');
                    const eventColors = {
                        reuniao: 'border-yellow-300 bg-yellow-50 text-yellow-900',
                        fiscalizacao: 'border-sky-300 bg-sky-50 text-sky-800',
                        manutencao: 'border-red-300 bg-red-50 text-red-800',
                        eventos: 'border-purple-300 bg-purple-50 text-purple-800', outros: 'border-gray-300 bg-gray-50 text-gray-700'
                    };
                    badge.type = 'button';
                    badge.className = `mt-1 block w-full truncate rounded-md border px-1 py-0.5 text-left text-[10px] font-semibold ${item.type === 'meta' ? 'border-green-300 bg-green-50 text-green-800' : (eventColors[item.category] || eventColors.outros)}`;
                    badge.title = item.title;
                    badge.textContent = item.title;
                    badge.addEventListener('click', () => openItem(item));
                    cell.appendChild(badge);
                });
                grid.appendChild(cell);
            }
        }

        document.getElementById('calendar-prev').addEventListener('click', () => {
            visibleMonth = makeDate(visibleMonth.getFullYear(), visibleMonth.getMonth() - 1, 1);
            renderCalendar();
        });

        document.getElementById('calendar-next').addEventListener('click', () => {
            visibleMonth = makeDate(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1, 1);
            renderCalendar();
        });

        document.getElementById('calendar-today').addEventListener('click', () => {
            visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            renderCalendar();
        });

        titleButton.addEventListener('click', () => {
            setPickerVisibility(monthPicker.classList.contains('hidden'));
        });

        document.getElementById('month-picker-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const selectedYear = Number(yearInput.value);
            const selectedMonth = Number(monthSelect.value);
            if (!Number.isInteger(selectedYear) || selectedYear < 1 || selectedYear > 9999) return;

            visibleMonth = makeDate(selectedYear, selectedMonth, 1);
            renderCalendar();
            setPickerVisibility(false);
        });

        document.addEventListener('click', (event) => {
            if (!monthPicker.contains(event.target) && !titleButton.contains(event.target)) {
                setPickerVisibility(false);
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') setPickerVisibility(false);
        });

        renderCalendar();
    })();
</script>
</body>
